name: MCP Factor staging QA
on:
  push:
    branches: [qa/pages-precutover]
permissions: {}
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check staging HTTP and public DNS
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from urllib.request import urlopen, Request
          base = 'https://chatlux.github.io/mcpfactor-website/'
          paths = ['', 'solutions/', 'media/', 'blog/', 'blog/agentifying-a-lengthy-static-form/',
                   'blog/dependency-chain-demystified/', 'contact/', 'shared/site.css',
                   'shared/site.js', 'assets/manychat-emerging-agency-award-2020.png'] + [
                       f'assets/danny-monzon-buzz-tv{i}.jpg' for i in range(1, 8)]
          def check(path):
              with urlopen(Request(base + path, headers={'User-Agent': 'MCP Factor staging QA'}), timeout=25) as r:
                  print(f'{r.status} {r.headers.get_content_type()} {r.url}')
                  if r.status != 200 or r.url != base + path:
                      raise RuntimeError(f'Unexpected response for {path}')
          with ThreadPoolExecutor(6) as pool:
              list(pool.map(check, paths))
          PY
          for item in 'mcpfactor.com NS' 'mcpfactor.com A' 'mcpfactor.com AAAA' 'mcpfactor.com MX' 'www.mcpfactor.com CNAME' 'www.mcpfactor.com A' 'app.mcpfactor.com CNAME' 'app.mcpfactor.com A'; do
            read -r host record <<< "$item"
            echo "$host $record"
            dig +short "$host" "$record"
          done
          for url in https://app.mcpfactor.com/ https://calendly.com/dmchat; do
            curl -L -sS -o /dev/null --max-time 25 -w '%{http_code} %{url_effective}\n' "$url" || true
          done
      - name: Install browsers
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chrome webkit
      - name: Check responsive layouts, assets, and navigation
        run: |
          node <<'JS'
          const { chromium, webkit } = require('playwright');
          const base = 'https://chatlux.github.io/mcpfactor-website/';
          const routes = ['', 'solutions/', 'media/', 'blog/', 'blog/agentifying-a-lengthy-static-form/', 'blog/dependency-chain-demystified/', 'contact/'];
          const problems = new Set();
          async function test(engine, options, name) {
            const browser = await engine.launch(options);
            try {
              for (const [width, height] of [[390,844], [768,1024], [1440,900]]) {
                const page = await browser.newPage({ viewport: { width, height } });
                const tag = route => name + ' ' + width + ' /' + route;
                for (const route of routes) {
                  const broken = new Set();
                  const responseListener = r => {
                    if (r.url().startsWith(base) && r.status() >= 400) broken.add(r.status() + ' ' + r.url());
                  };
                  const errorListener = e => broken.add(e.message);
                  page.on('response', responseListener);
                  page.on('pageerror', errorListener);
                  try {
                    const response = await page.goto(base + route, { waitUntil: 'domcontentloaded', timeout: 25000 });
                    if (!response?.ok() || page.url() !== base + route) problems.add(tag(route) + ' unexpected navigation');
                    await page.evaluate(() => { for (const img of document.images) img.loading = 'eager'; });
                    await page.waitForFunction(() => [...document.images].every(img => img.complete), { timeout: 12000 });
                    const data = await page.evaluate(site => ({
                      heading: document.querySelector('h1')?.innerText,
                      overflow: document.documentElement.scrollWidth - innerWidth,
                      css: [...document.querySelectorAll('link[rel=stylesheet]')].filter(link => link.href.startsWith(site) && !link.sheet).map(link => link.href),
                      images: [...document.images].map(img => ({ url: img.currentSrc || img.src, ok: !!img.naturalWidth, alt: img.hasAttribute('alt') })),
                      nav: [...document.querySelectorAll('a[href]')].map(a => a.href),
                      video: [...document.querySelectorAll('iframe')].some(f => f.src.includes('youtube.com/embed/'))
                    }), base);
                    if (!data.heading || data.overflow > 2) problems.add(tag(route) + ' heading/overflow ' + JSON.stringify({ heading: data.heading, overflow: data.overflow }));
                    for (const item of data.css) problems.add(tag(route) + ' missing stylesheet ' + item);
                    for (const img of data.images.filter(i => !i.ok || !i.alt)) problems.add(tag(route) + ' image ' + JSON.stringify(img));
                    for (const dest of ['', 'solutions/', 'media/', 'blog/', 'contact/']) {
                      if (!data.nav.includes(base + dest)) problems.add(tag(route) + ' missing navigation ' + dest);
                    }
                    if (!data.nav.includes('https://app.mcpfactor.com/')) problems.add(tag(route) + ' missing MCP Factor link');
                    if (route === 'media/' && new Set(data.images.filter(i => /buzz-tv[1-7]\.jpg/.test(i.url) && i.ok).map(i => i.url)).size !== 7) problems.add(tag(route) + ' expected seven TV images');
                    if (!route && !data.images.some(i => i.ok && i.url.includes('manychat-emerging-agency-award-2020.png'))) problems.add(tag(route) + ' missing award image');
                    if (route.startsWith('blog/agentifying') && !data.video) problems.add(tag(route) + ' missing YouTube iframe');
                    if (route === 'contact/' && !data.nav.some(link => link.startsWith('mailto:ai@mcpfactor.com'))) problems.add(tag(route) + ' missing email link');
                    console.log(tag(route), response?.status(), 'images', data.images.length, 'overflow', data.overflow);
                  } catch (error) {
                    problems.add(tag(route) + ' ' + error.message);
                  } finally {
                    page.off('response', responseListener);
                    page.off('pageerror', errorListener);
                    for (const issue of broken) problems.add(tag(route) + ' ' + issue);
                  }
                }
                await page.close();
              }
            } finally {
              await browser.close();
            }
          }
          (async () => {
            await test(chromium, { channel: 'chrome' }, 'Chrome');
            await test(webkit, {}, 'WebKit');
            for (const problem of problems) console.error(problem);
            if (problems.size) process.exitCode = 1;
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
