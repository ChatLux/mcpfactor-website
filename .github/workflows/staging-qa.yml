name: MCP Factor production verification
on:
  push:
    branches: [qa/pages-precutover]
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check authoritative and recursive DNS
        run: |
          for server in ns55.domaincontrol.com ns56.domaincontrol.com 1.1.1.1 8.8.8.8; do
            echo "Resolver $server"
            for test in 'mcpfactor.com A' 'mcpfactor.com AAAA' 'www.mcpfactor.com CNAME' 'mcpfactor.com MX' 'app.mcpfactor.com CNAME' 'sig1._domainkey.mcpfactor.com CNAME' '_acme-challenge.mcpfactor.com CNAME'; do
              read -r host type <<< "$test"
              echo "$host $type"
              dig @"$server" +time=2 +tries=1 +noall +answer "$host" "$type" || true
            done
          done
          echo "SPF"
          dig @ns55.domaincontrol.com +short mcpfactor.com TXT | grep 'v=spf1' || true
      - name: Check HTTPS routes, redirects, and platform
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from urllib.request import urlopen, Request
          import ssl, socket, re, time
          base = 'https://mcpfactor.com/'
          pages = {
              '': 'Ai Systems Architect',
              'solutions/': 'Custom Ai Solutions',
              'media/': 'Media & Appearances',
              'blog/': 'Blog &amp; Field Notes',
              'blog/agentifying-a-lengthy-static-form/': 'Agentifying a Lengthy Static Form',
              'blog/dependency-chain-demystified/': 'Dependency Chain Demystified',
              'contact/': 'Ai Project Consultation',
          }
          checks = [(base + p, base + p, expected) for p, expected in pages.items()]
          checks += [(base + f'assets/danny-monzon-buzz-tv{i}.jpg', base + f'assets/danny-monzon-buzz-tv{i}.jpg', '') for i in range(1, 8)]
          checks += [
              ('http://mcpfactor.com/', base, 'Ai Systems Architect'),
              ('http://www.mcpfactor.com/', base, 'Ai Systems Architect'),
              ('https://www.mcpfactor.com/', base, 'Ai Systems Architect'),
              ('https://www.mcpfactor.com/media/', base + 'media/', 'Media & Appearances'),
              (base + 'shared/site.css', base + 'shared/site.css', '.nav-inner'),
              (base + 'shared/site.js', base + 'shared/site.js', ''),
              (base + 'assets/manychat-emerging-agency-award-2020.png', base + 'assets/manychat-emerging-agency-award-2020.png', ''),
              ('https://app.mcpfactor.com/', 'https://app.mcpfactor.com/', ''),
          ]
          def check(record):
              url, expected_url, marker = record
              try:
                  with urlopen(Request(url, headers={'User-Agent': 'MCP Factor production QA'}), timeout=14) as r:
                      content_type = r.headers.get_content_type()
                      body = r.read(150000).decode(errors='replace') if content_type in ('text/html', 'text/css') else ''
                      matched = not marker or marker in body
                      mixed = bool(re.search(r"""(?:\bsrc\s*=|\burl\(|<link[^>]*href\s*=)\s*['\"]?http://""", body, re.I))
                      ok = r.status == 200 and r.url == expected_url and matched and not mixed
                      print(f'{"PASS" if ok else "FAIL"} {url} {r.status} {r.url} content={matched} mixed-source={mixed}', flush=True)
                      return ok
              except Exception as e:
                  print(f'FAIL {url} {e}', flush=True)
                  return False
          for attempt in range(10):
              print(f'Production check attempt {attempt + 1}', flush=True)
              with ThreadPoolExecutor(8) as pool:
                  outcomes = list(pool.map(check, checks))
              if all(outcomes) or attempt == 9:
                  break
              time.sleep(18)
          for host in ('mcpfactor.com', 'www.mcpfactor.com', 'app.mcpfactor.com'):
              try:
                  with socket.create_connection((host, 443), timeout=10) as sock:
                      with ssl.create_default_context().wrap_socket(sock, server_hostname=host) as tls:
                          cert = tls.getpeercert()
                          print(f'TLS PASS {host} {tls.version()} expires {cert["notAfter"]}')
              except Exception as e:
                  print(f'TLS FAIL {host} {e}')
          if not all(outcomes):
              raise SystemExit(1)
          PY
